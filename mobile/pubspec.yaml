name: fixit_ghana
description: >
  FixIt Ghana — find trusted professionals, get the job done.
  Customer + professional service marketplace mobile app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Lightweight local flags (onboarding completion, etc.)
  shared_preferences: ^2.3.2

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
